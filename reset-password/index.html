<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex,nofollow">
    <title>Réinitialiser votre mot de passe · 72 Heures</title>
    <meta name="description" content="Choisissez un nouveau mot de passe pour votre compte 72 Heures.">
    <link rel="canonical" href="https://72heures.eu/reset-password/">
    <link rel="icon" type="image/png" href="../assets/icon-only.png">
    <link rel="apple-touch-icon" href="../assets/icon-only.png">
    <style>
        :root { --bg:#071f20; --card:#103434; --ink:#f4f1e8; --muted:#b9cbc6; --accent:#f59e42; --line:#295050; --green:#29483B }
        * { box-sizing:border-box }
        body { min-height:100vh; margin:0; font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--ink); background:var(--bg); line-height:1.6 }
        a { color:inherit; text-decoration:none }
        .wrap { max-width:920px; margin:auto; padding:0 24px }
        .nav { background:#EEF4EFf2; border-bottom:1px solid #CADBD0 }
        .navin { height:72px; display:flex; align-items:center; justify-content:space-between; gap:20px }
        .brand { color:var(--green); font-size:23px; font-weight:900; letter-spacing:-1px }
        .brand b { color:var(--accent) }
        .back { color:#365B4B; font-size:14px; font-weight:700; padding:9px 4px; border-bottom:2px solid transparent }
        .back:hover { color:var(--green); border-bottom-color:#E9A56A }
        .back:focus-visible, button:focus-visible, input:focus-visible { outline:3px solid var(--accent); outline-offset:3px }
        main { min-height:calc(100vh - 174px); display:grid; place-items:center; padding:52px 0 }
        .panel { width:min(100%,560px); padding:clamp(26px,6vw,48px); border:1px solid var(--line); border-radius:24px; background:var(--card); box-shadow:0 24px 58px rgba(0,0,0,.18) }
        .eyebrow { color:var(--accent); font-size:12px; font-weight:800; letter-spacing:.14em; text-transform:uppercase }
        h1 { margin:12px 0 10px; font-size:clamp(32px,6vw,44px); line-height:1.1; letter-spacing:-.045em }
        .intro { margin:0 0 28px; color:var(--muted) }
        .fields { display:grid; gap:18px }
        label { display:block; margin-bottom:7px; font-size:14px; font-weight:700 }
        input { width:100%; min-height:50px; padding:12px 14px; border:1px solid #55706a; border-radius:10px; background:#092727; color:var(--ink); font:inherit }
        input::placeholder { color:#91aaa2 }
        .hint { margin:7px 0 0; color:var(--muted); font-size:13px }
        button { width:100%; min-height:50px; margin-top:6px; padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#172b23; font:inherit; font-weight:800; cursor:pointer }
        button:hover:not(:disabled) { background:#ffb45d }
        button:disabled { cursor:wait; opacity:.68 }
        .message { margin:0 0 20px; padding:13px 15px; border:1px solid #7b5b3d; border-radius:10px; background:#342e25; color:#ffe0c0 }
        .message[hidden] { display:none }
        .message.success { border-color:#5d846b; background:#183b31; color:#d6f0dc }
        .message.info { border-color:#55706a; background:#153331; color:#d4e4dd }
        .secondary { display:inline-block; margin-top:24px; color:#eac49d; font-size:14px; font-weight:700; text-decoration:underline; text-underline-offset:3px }
        .secondary:focus-visible { outline:3px solid var(--accent); outline-offset:4px }
        footer { padding:22px 0 30px; color:#71877D; font-size:13px }
        .foot { display:flex; justify-content:space-between; gap:12px 20px; flex-wrap:wrap }
        footer a { text-decoration:underline; text-underline-offset:3px }
        @media (max-width:560px) { .wrap { padding:0 18px } main { padding:34px 0 } .panel { border-radius:20px } }
    </style>
    <script>
        (() => {
            const fragment = window.location.hash;
            const params = new URLSearchParams(fragment.startsWith("#") ? fragment.slice(1) : fragment);
            const token = params.get("token");
            if (fragment) window.history.replaceState(null, "", window.location.pathname + window.location.search);

            window.addEventListener("DOMContentLoaded", () => {
                const form = document.getElementById("reset-form");
                const fields = document.getElementById("password-fields");
                const message = document.getElementById("message");
                const submit = document.getElementById("submit");
                const password = document.getElementById("password");
                const confirmation = document.getElementById("confirmation");
                const validToken = typeof token === "string" && /^[a-f0-9]{64}$/.test(token);

                const showMessage = (text, kind = "error") => {
                    message.textContent = text;
                    message.className = "message" + (kind === "success" ? " success" : kind === "info" ? " info" : "");
                    message.hidden = false;
                };

                if (!validToken) {
                    fields.hidden = true;
                    showMessage(token ? "Ce lien de réinitialisation est invalide. Demandez un nouveau lien depuis l’application." : "Aucun lien de réinitialisation n’a été trouvé. Ouvrez le lien reçu par e-mail ou demandez-en un nouveau depuis l’application.", "info");
                    return;
                }

                form.addEventListener("submit", async event => {
                    event.preventDefault();
                    message.hidden = true;
                    if (password.value.length < 15 || password.value.length > 128) {
                        showMessage("Le mot de passe doit contenir entre 15 et 128 caractères.");
                        password.focus();
                        return;
                    }
                    if (password.value !== confirmation.value) {
                        showMessage("Les mots de passe ne correspondent pas.");
                        confirmation.focus();
                        return;
                    }

                    submit.disabled = true;
                    submit.textContent = "Réinitialisation en cours…";
                    try {
                        const response = await fetch("https://seven2heuresbackend.onrender.com/auth/reset-password", {
                            method: "POST",
                            mode: "cors",
                            credentials: "omit",
                            cache: "no-store",
                            referrerPolicy: "no-referrer",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ token, password: password.value, passwordConfirmation: confirmation.value })
                        });
                        let result = {};
                        try { result = await response.json(); } catch {}
                        if (response.ok) {
                            showMessage("Votre mot de passe a été réinitialisé. Vous pouvez maintenant vous connecter dans l’application.", "success");
                            form.hidden = true;
                            return;
                        }
                        if (result.code === "PASSWORD_RESET_TOKEN_INVALID") {
                            showMessage("Ce lien a expiré ou a déjà été utilisé. Demandez un nouveau lien depuis l’application.");
                        } else if (response.status === 429) {
                            showMessage("Trop de tentatives. Patientez quelques minutes, puis réessayez.");
                        } else if (response.status === 400 && result.field === "passwordConfirmation") {
                            showMessage("Les mots de passe ne correspondent pas.");
                        } else if (response.status === 400 && result.fields?.password) {
                            showMessage("Le mot de passe doit contenir entre 15 et 128 caractères.");
                        } else {
                            showMessage("La réinitialisation n’a pas abouti. Vérifiez votre connexion et réessayez.");
                        }
                    } catch {
                        showMessage("Impossible de joindre le service. Vérifiez votre connexion et réessayez.");
                    } finally {
                        if (!form.hidden) {
                            submit.disabled = false;
                            submit.textContent = "Réinitialiser le mot de passe";
                        }
                    }
                });
            }, { once: true });
        })();
    </script>
</head>
<body>
    <nav class="nav" aria-label="Navigation principale">
        <div class="wrap navin">
            <a class="brand" href="/" aria-label="72 Heures, accueil"><b>72</b> HEURES</a>
            <a class="back" href="/">Retour au site</a>
        </div>
    </nav>
    <main class="wrap">
        <section class="panel" aria-labelledby="title">
            <div class="eyebrow">Gestion de votre compte</div>
            <h1 id="title">Réinitialiser le mot de passe</h1>
            <p class="intro">Choisissez un nouveau mot de passe pour retrouver l’accès à votre compte 72 Heures.</p>
            <p id="message" class="message" role="status" aria-live="polite" hidden></p>
            <form id="reset-form" class="fields" novalidate>
                <div id="password-fields" class="fields">
                    <div>
                        <label for="password">Nouveau mot de passe</label>
                        <input id="password" name="password" type="password" autocomplete="new-password" minlength="15" maxlength="128" required>
                        <p class="hint">Entre 15 et 128 caractères.</p>
                    </div>
                    <div>
                        <label for="confirmation">Confirmer le mot de passe</label>
                        <input id="confirmation" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="15" maxlength="128" required>
                    </div>
                    <button id="submit" type="submit">Réinitialiser le mot de passe</button>
                </div>
            </form>
            <a class="secondary" href="/">Retour au site</a>
        </section>
    </main>
    <footer>
        <div class="wrap foot">
            <div><strong>72 Heures</strong> · Autonomie familiale</div>
            <div>© 2026 • 72heures.eu</div>
            <div><a href="/confidentialite/">Confidentialité</a></div>
        </div>
    </footer>
</body>
</html>
